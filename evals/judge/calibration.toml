# Calibration set for the model judge (warrant_evals/judge.py).
# Run `uv run python -m warrant_evals.judge` from evals/ to print the judge's
# agreement with these labels. Each case pairs the description of one planted
# problem (copied from evals/scenarios/review-*.toml or
# evals/benchmark/review-*.toml) with a short report excerpt. `label` is the
# answer a careful human reader gives: `yes` if the excerpt reports that
# problem as a defect, `no` if it does not. Most excerpts are copied from saved
# eval and benchmark transcripts; the `written-` cases mention the planted code
# or a term without reporting the defect, which is the false-pass risk.
# Add each judge error found in a transcript as a new case.

# yes: the excerpt reports the problem, often in words no term matches.

[[case]]
