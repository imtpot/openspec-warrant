[[case]]
name = "refund-half-cents-round-the-wrong-way"
description = "refund_amount() in app/refund.py rounds with Python's round(), which rounds an exact half to the even number, but the requirement \"Refund amount\" says an exact half cent is rounded up."
text = '''
3. **Half cents round the wrong way** (`app/refund.py:14`). The spec says an exact half cent rounds up. For example, `refund_amount(1, Apr 16, Apr 1, May 1)` should give 0.5 → 1 but returns **0**.
'''
label = "yes"

[[case]]
name = "refund-billed-days-regression"
description = "The branch changes the default of include_end in days_between() in app/dates.py from False to True, so billed_days() in app/report.py, which uses the default, now also bills the end day of [start, end)."
text = '''
**1. Regression in `billed_days` (`app/dates.py:4`, `app/report.py:6`)**
The change to `days_between` flips the default `include_end` from `False` to `True`. `billed_days` calls it with no argument, so its behavior changes. Its docstring says "the end day is not billed".
'''
label = "yes"

[[case]]
name = "export-slice-ends-one-order-early"
description = "export_page() in app/export.py slices rows[start:start + size - 1], so each page holds one order less than size and drops the last order of the page; the requirement \"Page content\" asks for positions (number - 1) * size to number * size - 1."
text = '''
5. **blocking**: `app/export.py:11`: the slice ends one order early, so every `size`-th order is never exported on any page. That is data loss.
'''
label = "yes"

[[case]]
name = "export-seen-list-shared-across-calls"
description = "export_page() in app/export.py has the mutable default argument seen=[], which keeps ids between calls, so a later export skips rows; docs/standards.md forbids mutable default arguments."
text = '''
6. **WARNING**: `app/export.py:16`: `if row['id'] not in seen:` uses a list shared across calls. A second export in the same process drops orders, so the page no longer holds the orders at the required positions.
'''
label = "yes"

[[case]]
name = "export-report-total-crashes"
description = "The branch changes find() in app/store.py from find(orders, customer) to find(customer, orders), but total() in app/report.py still calls find(orders, customer), so that caller now passes the arguments in the wrong order."
text = '''
1. **`find`'s arguments were swapped, which breaks `app/report.py:6`.** `store.find` is now `find(customer, orders)`, but `report.total` still calls `find(orders, customer)`. It now loops over the characters of the customer string and indexes each one with `['customer']`, so it raises `TypeError`.
'''
label = "yes"

