[[case]]
name = "refund-test-compares-output-with-itself"
description = "test_half_of_april in tests/test_refund.py computes its expected value by calling refund_amount() itself, so the test always passes; docs/standards.md says expected values are literals worked out by hand (1500 in the spec)."
text = '''
