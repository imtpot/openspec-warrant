kind = "review"
fixture = "review-export/fixture"
setup = "setup.sh"
prompt = "Review the current branch before merge. Nobody can answer questions during this run."
# Planted problems; each group lists terms of which one must appear in the report.
problems = [
  { terms = ["size - 1", "size-1", "off-by-one", "off by one", "one order short", "one item short", "drops the last"], description = "export_page() in app/export.py slices rows[start:start + size - 1], so each page holds one order less than size and drops the last order of the page; the requirement \"Page content\" asks for positions (number - 1) * size to number * size - 1." },
  { terms = ["tie", "id descending", "reverse=True"], description = "export_page() in app/export.py sorts by (date, id) with reverse=True, so orders with the same date come in descending id order, but the requirement \"Order\" asks for id ascending (order 3 before order 7)." },
  { terms = ["not closed", "never closed", "with open", "file handle", "leak", "f.close"], description = "export_page() in app/export.py opens the output file with a plain open() and never closes it, against the rule in docs/standards.md to open files with `with`." },
  { terms = ["shell=True", "injection"], description = "export_page() in app/export.py runs subprocess.run(f'gzip -f {path}', shell=True), so the path goes to a shell (command injection), against the rule in docs/standards.md never to pass user input to a shell." },
  { terms = ["mutable default", "seen=[]", "default argument", "shared list"], description = "export_page() in app/export.py has the mutable default argument seen=[], which keeps ids between calls, so a later export skips rows; docs/standards.md forbids mutable default arguments." },
  { terms = ["report.py"], description = "The branch changes find() in app/store.py from find(orders, customer) to find(customer, orders), but total() in app/report.py still calls find(orders, customer), so that caller now passes the arguments in the wrong order." },
]
