---
schema: warrant

context: |
  This repository builds openspec-warrant: an agent-neutral extension of OpenSpec
  1.16, published on GitHub under MIT. It ships an OpenSpec schema and agent
  skills, installed into other projects with the `skills` CLI. Its idea: every
  requirement is unambiguous (EARS), every changed line is warranted by a
  requirement, and every completion claim is warranted by verification evidence.
  Skills must not assume any project, language or agent. Project specifics come
  from a project contract that the target project declares.
  Supported agents: Claude Code, Codex, GitHub Copilot CLI.
  Skills are written from scratch; upstream skill sets (mattpocock/skills,
  obra/superpowers, DietrichGebert/ponytail) are inspiration only, never copied.
  Write all artifacts in English.

# The warrant schema carries the rules for EARS requirements, assumptions, the
# option ladder, and the review and verification task groups. Only rules that
# the schema does not cover belong here.
rules:
  tasks:
  - Map each requirement to at least one test task
  - List every file, fixture and configuration the change must reach

operations:
  apply:
    guidance:
    - Follow warrant-minimal-change while writing code
    - Follow warrant-verify before marking a task complete
  archive:
    guidance:
    - Archive only when every task records the evidence of its verification
