[project]
name = "warrant-evals"
version = "0.1.0"
description = "Behavioral evals for the openspec-warrant schema and skills"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "evals"

[tool.pytest.ini_options]
testpaths = ["evals/tests"]
